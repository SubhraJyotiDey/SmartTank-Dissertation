[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
upload_speed = 921600
lib_deps = 

[env:esp32_ota]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
upload_protocol = espota
upload_port = 192.168.29.130
upload_flags =
    --port=3232
    --auth=admin123
lib_deps = 
