name: Build ESP32 Firmware & Automatic OTA Artifacts

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Node Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Pressure Tap Node Firmware
        run: |
          cd firmware/esp32_pressure_tap_node
          pio run
          cp .pio/build/esp32dev/firmware.bin ../../pressure_node_firmware.bin

      - name: Build Ultrasonic Tank Node Firmware
        run: |
          cd firmware/esp32_ultrasonic_tank_node
          pio run
          cp .pio/build/esp32dev/firmware.bin ../../ultrasonic_node_firmware.bin

      - name: Upload Firmware Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: |
            pressure_node_firmware.bin
            ultrasonic_node_firmware.bin
          retention-days: 14

      - name: Publish or Update Latest GitHub Release for Auto-OTA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Automated Firmware Build
          body: |
            Automated Over-The-Air (OTA) build triggered by commit ${{ github.sha }}.
            Contains compiled binary images polled every 15 minutes by both ESP32 nodes.
          files: |
            pressure_node_firmware.bin
            ultrasonic_node_firmware.bin
            firmware/version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
